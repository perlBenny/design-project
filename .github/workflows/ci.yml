name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Code quality: install, lint, format, typecheck, tests.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Infra: the dev Docker Compose stack starts, every service is healthy,
  # and the database migrations and seed work.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create env file from example
        run: cp .env.example .env.dev

      - name: Start services
        run: docker compose --env-file .env.dev up -d --wait

      - name: Postgres accepts queries
        run: docker compose --env-file .env.dev exec -T postgres psql -U designer -d designer_dev -c "select 1"

      - name: Bucket was created
        run: |
          # storage-init is a one-time job; wait for it to finish, then check its exit code.
          container=$(docker compose --env-file .env.dev ps -aq storage-init)
          code=$(timeout 60 docker wait "$container")
          docker compose --env-file .env.dev logs --no-log-prefix storage-init
          [ "$code" = "0" ]

      # ---------- Database ----------
      - name: Migrations apply on an empty DB
        run: docker compose --env-file .env.dev run --rm dbmate up

      - name: db/schema.sql is up to date
        run: |
          # If this fails: run `pnpm db:migrate` locally and commit db/schema.sql
          git diff --exit-code -I '^-- Dumped' db/schema.sql

      - name: Every migration rolls back, then applies again
        run: |
          count=$(ls db/migrations/*.sql | wc -l)
          for i in $(seq "$count"); do docker compose --env-file .env.dev run --rm dbmate rollback; done
          docker compose --env-file .env.dev run --rm dbmate up
          git diff --exit-code -I '^-- Dumped' db/schema.sql

      - name: Seed runs twice without errors or duplicates
        run: |
          docker compose --env-file .env.dev run --rm seed
          docker compose --env-file .env.dev run --rm seed
          tips=$(docker compose --env-file .env.dev exec -T postgres psql -U designer -d designer_dev -tAc "select count(*) from tips")
          echo "tips: $tips"
          [ "$tips" = "9" ]

      - name: DB rules reject bad data
        run: docker compose --env-file .env.dev run --rm --entrypoint psql seed -q -f /tests/constraints.sql

      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.dev logs

      - name: Stop services
        if: always()
        run: docker compose --env-file .env.dev down -v
