# Dev services. Run with: pnpm infra:up  (uses .env.dev)
name: designer-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-designer_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subfolder, so mount the parent folder
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible file storage for dev (prod will use Cloudflare R2 or AWS S3).
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: creates the bucket and makes it publicly readable, then exits.
  # Uses the official AWS CLI, which works with any S3-compatible storage.
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-designer-images}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://storage:9000 s3api"
        $$S3 head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || $$S3 create-bucket --bucket "$$S3_BUCKET"
        $$S3 put-bucket-policy --bucket "$$S3_BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$S3_BUCKET/*\"]}]}"
        echo "bucket $$S3_BUCKET ready"

  # ---------- Tools: run on demand only (profile "tools"), never by `up` ----------

  # Runs SQL migrations from db/migrations. Usage: pnpm db:migrate / db:rollback / db:new <name>
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.38
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password is NOT put in the URL: characters like # / @ ? would break it.
      # The Postgres driver reads it from PGPASSWORD instead, so any password works.
      DATABASE_URL: postgres://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB:-designer_dev}?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db

  # Loads db/seed/base.sql (always) and db/seed/dev.sql (when SEED_SAMPLE_DATA=true).
  seed:
    image: postgres:18-alpine
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-designer_dev}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    volumes:
      - ./db/seed:/seed:ro
      - ./db/tests:/tests:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # -1 = one transaction per file: a failure leaves nothing half-done
        psql -v ON_ERROR_STOP=1 -q -1 -f /seed/base.sql
        echo "base seed done"
        if [ "$$SEED_SAMPLE_DATA" = "true" ]; then
          psql -v ON_ERROR_STOP=1 -q -1 -f /seed/dev.sql
          echo "sample data done"
        fi

volumes:
  pgdata:
  storagedata:
